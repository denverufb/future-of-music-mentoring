<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mentee Progress — Future of Music</title>

<style>
:root{
  --bg:#141729;
  --card:#1c2040;
  --text:#ffffff;
  --muted:#9199CA;
  --accent:#76ADCB;
  --success:#4CAF50;
  --max:980px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:var(--bg);
  color:var(--text);
  line-height:1.45;
  text-align:center;
}

.container{
  max-width:var(--max);
  margin:0 auto;
  padding:1rem;
}

.site-header{
  border-bottom:1px solid rgba(255,255,255,.15);
  padding:1.5rem 0;
}

.brand{
  font-weight:800;
  font-size:1.35rem;
}

.subtitle{
  color:var(--muted);
  font-size:.9rem;
  margin-top:.25rem;
}

.main-nav{
  margin-top:1rem;
  display:flex;
  justify-content:center;
  gap:.75rem;
  flex-wrap:wrap;
}

.nav-link{
  text-decoration:none;
  padding:.5rem 1rem;
  border-radius:999px;
  background:#1E2238;
  border:2px solid var(--accent);
  color:#fff;
  font-weight:600;
}

.nav-link:hover{
  background:var(--accent);
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:1.5rem;
  margin-top:1.5rem;
  text-align:left;
}

.pillar{
  margin-top:1.25rem;
}

.progress-bar{
  background:#1E2238;
  border-radius:6px;
  overflow:hidden;
  margin:.5rem 0;
}

.progress-fill{
  height:12px;
  background:var(--accent);
}

.goal{
  display:flex;
  align-items:center;
  gap:.75rem;
  padding:.5rem 0;
  cursor:pointer;
}

.check{ color:var(--success); font-size:1.2rem }
.unchecked{ color:var(--muted); font-size:1.2rem }

.error{
  color:#ff6b6b;
  margin-top:.75rem;
  font-size:.9rem;
}

input, button{
  padding:.75rem;
  font-size:1rem;
  border-radius:6px;
  border:none;
  margin-top:.5rem;
}

button{
  background:var(--accent);
  color:#fff;
  cursor:pointer;
  font-weight:600;
}

footer{
  margin:2rem 0;
  color:var(--muted);
  font-size:.85rem;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  padding:8px;
  border-bottom:1px solid #333;
  text-align:left;
}

th{
  color:var(--muted);
}
</style>
</head>

<body>

<header class="site-header">
  <div class="container">
    <div class="brand">Future of Music & Youth Creator Launch</div>
    <div class="subtitle">Mentorship Progress Portal</div>

    <nav class="main-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="goals.html" class="nav-link">Submit Weekly Goals</a>
      <a href="survey.html" class="nav-link">Weekly Check-In</a>
      <a href="progress.html" class="nav-link">Progress</a>
    </nav>
  </div>
</header>

<main class="container">

  <div class="card" id="lookup">
    <h2>View Progress</h2>
    <p style="color:var(--muted)">Enter your first name to view progress.</p>
    <input id="nameInput" placeholder="Enter first name" />
    <br>
    <button onclick="loadProgress()">View Progress</button>
    <div class="error" id="errorMsg"></div>
  </div>

  <div class="card" id="progressCard" style="display:none;">
    <h2 id="menteeName"></h2>
    <div id="progressSections"></div>
  </div>

</main>

<footer>
  © <span id="year"></span> Future of Music Mentoring
</footer>

<script>
document.getElementById("year").textContent=new Date().getFullYear();

const mentees={
  jeremiah:{
    name:"Jeremiah Jones",
    progress:{Academics:40,"Personal Development":35,Entrepreneurship:25},
    note:"Jeremiah is showing steady improvement. Continue focusing on academic consistency and daily structure."
  },
  billy:{
    name:"Billy Williams",
    progress:{Academics:75,"Personal Development":60,Entrepreneurship:55},
    note:"Billy has strong potential. Encourage stronger discipline and long-term goal planning."
  },
  leah:{
    name:"Leah Jimerson",
    progress:{Academics:95,"Personal Development":85,Entrepreneurship:70},
    note:"Leah is performing at a high level. Continue leadership development and career preparation focus."
  },
  zion:{
    name:"Zion Williams",
    progress:{Academics:50,"Personal Development":65,Entrepreneurship:45},
    note:"Zion is growing in confidence. Academic accountability remains the priority."
  },
  derrick:{
    name:"Derrick Flannel",
    progress:{Academics:30,"Personal Development":50,Entrepreneurship:20},
    note:"Derrick needs improvement in following through. Continue reinforcing responsibility habits."
  },
  micah:{
    name:"Micah White",
    progress:{Academics:70,"Personal Development":75,Entrepreneurship:60},
    note:"Micah is progressing well. Keep building consistency and leadership confidence."
  }
};

let currentMentee=null;

function loadProgress(){
  const input=document.getElementById("nameInput").value.trim().toLowerCase();
  const key=Object.keys(mentees).find(k=>mentees[k].name.split(" ")[0].toLowerCase()===input);

  if(!key){
    document.getElementById("errorMsg").textContent="No progress found for this name.";
    return;
  }

  currentMentee=key;

  document.getElementById("lookup").style.display="none";
  document.getElementById("progressCard").style.display="block";
  document.getElementById("menteeName").textContent=mentees[key].name+" — Progress Overview";

  renderProgress();
}

function renderProgress(){
  const container=document.getElementById("progressSections");
  container.innerHTML="";

  for(const pillar in mentees[currentMentee].progress){
    const percent=mentees[currentMentee].progress[pillar];

    const section=document.createElement("div");
    section.style.marginTop="1.5rem";

    section.innerHTML=`
      <h3>${pillar}</h3>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${percent}%"></div>
      </div>
      <p style="color:var(--muted)">Progress: ${percent}%</p>
    `;

    container.appendChild(section);
  }

  const noteSection=document.createElement("div");
  noteSection.innerHTML=`
    <hr style="margin:2rem 0; border:1px solid #2a2f55;">
    <h3>Mentor Notes</h3>
    <div class="note-box">${mentees[currentMentee].note}</div>
  `;

  container.appendChild(noteSection);
}
</script>

</body>
</html>
