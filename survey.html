<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weekly Check-In — Future of Music</title>

<style>
:root{
  --bg:#141729;
  --card:#1c2040;
  --text:#ffffff;
  --muted:#9199CA;
  --accent:#76ADCB;
  --success:#4CAF50;
  --max:980px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:var(--bg);
  color:var(--text);
  line-height:1.45;
  text-align:center;
}

.container{
  max-width:var(--max);
  margin:0 auto;
  padding:1rem;
}

.site-header{
  border-bottom:1px solid rgba(255,255,255,.15);
  padding:1.5rem 0;
}

.brand{
  font-weight:800;
  font-size:1.35rem;
}

.subtitle{
  color:var(--muted);
  font-size:.9rem;
  margin-top:.25rem;
}

.main-nav{
  margin-top:1rem;
  display:flex;
  justify-content:center;
  gap:.75rem;
  flex-wrap:wrap;
}

.nav-link{
  text-decoration:none;
  padding:.5rem 1rem;
  border-radius:999px;
  background:#1E2238;
  border:2px solid var(--accent);
  color:#fff;
  font-weight:600;
}

.nav-link:hover{
  background:var(--accent);
}

.card {
  background: var(--card);
  border-radius: 12px;
  padding: 2rem;
  margin-top: 1.5rem;
  text-align: left;
}

select {
  width: 100%;
  max-width: 400px;
  padding: 0.75rem;
  font-size: 1rem;
  border-radius: 6px;
  border: 2px solid var(--accent);
  background: #1E2238;
  color: white;
  margin-top: 1rem;
}

.iframe-wrapper {
  background: white; /* Calendly looks best on white */
  border-radius: 12px;
  overflow: hidden;
  margin-top: 20px;
}

footer{
  margin:2rem 0;
  color:var(--muted);
  font-size:.85rem;
}

.lede { margin: 1rem 0; }
a { color: var(--accent); text-decoration: none; }
</style>
</head>

<body>

<header class="site-header">
  <div class="container">
    <div class="brand">Future of Music & Youth Creator Launch</div>
    <div class="subtitle">Schedule Weekly Meeting</div>

    <nav class="main-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="goals.html" class="nav-link">Submit Weekly Goals</a>
      <a href="survey.html" class="nav-link">Weekly Check-In</a>
      <a href="progress.html" class="nav-link">Progress</a>
    </nav>
  </div>
</header>

<main class="container">
  <div class="card">
    <h1 style="margin:0;">Schedule Your Weekly Check-In</h1>
    <p class="lede">Select your mentor below and schedule your 5–10 minute weekly check-in.</p>

    <div style="text-align: center; margin-bottom: 2rem;">
      <label for="mentor-select" style="display:block; color:var(--muted);">Who is your mentor?</label>
      <select id="mentor-select">
        <option value="">-- Select Mentor --</option>
        <option value="https://calendly.com/aereon-fomusic/30min">Aereon Robinson</option>
        <option value="https://calendly.com/gabriel-e-walker2008/30min">Gabriel Walker</option>
        <option value="https://calendly.com/qwentin-fomusic/mentoring">Qwentin Blassingame</option>
      </select>
    </div>

    <section class="iframe-wrapper" aria-label="Weekly check-in scheduling">
      <iframe
        id="mentor-calendar"
        src=""
        title="Schedule Check-In"
        width="100%"
        height="700"
        frameborder="0"
        style="display: none;"
      ></iframe>
    </section>

    <div style="text-align: center; margin-top: 1rem;">
      <a id="fallback-link" href="" target="_blank" rel="noopener" style="display: none;">
        Can't see the calendar? Open in a new tab →
      </a>
    </div>
  </div>
</main>

<footer>
  <div class="container">
    <p>© <span id="year-survey"></span> Future of Music Mentoring</p>
  </div>
</footer>

<script>
  document.getElementById("year-survey").textContent = new Date().getFullYear();

  const select = document.getElementById("mentor-select");
  const iframe = document.getElementById("mentor-calendar");
  const fallback = document.getElementById("fallback-link");

  select.addEventListener("change", function () {
    const url = this.value;
    if (url) {
      iframe.src = url;
      iframe.style.display = "block";
      fallback.href = url;
      fallback.style.display = "inline-block";
    } else {
      iframe.src = "";
      iframe.style.display = "none";
      fallback.style.display = "none";
    }
  });
</script>

</body>
</html>
